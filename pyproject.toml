[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nachi-native-feedback"
version = "0.1.0.dev0"
description = "Unofficial SDK-independent, read-only native joint feedback for a tested Nachi CFD profile"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
nachi-feedback = "nachi_native_feedback.__main__:main"
nachi-feedback-monitor = "nachi_native_feedback.live_monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
